project:
  title: "analytiQC"
  output-dir: "docs"

authors:
  - name: H. Wimmer
    affiliation: 
      name: "Hochschule Campus Wien"
      url: "https://www.hcw.ac.at"
    email: helge.wimmer@hcw.ac.at

date: 11.09.2026
date-format: "DD. MMMM YYYY"
editor: visual
lang: de

format: 
  revealjs:
    chalkboard: true
    multiplex: true
    transition: convex
    background-transition: fade
    slide-number: c/t
    footer:  '<span id="chapter-footer"></span>'
    include-after-body: chapter/footer.html
    logo: images/logo.png
    show-slide-number: print
    incremental: true   
    scrollable: true
    theme: [default, mytheme.scss]

execute: 
  echo: true


